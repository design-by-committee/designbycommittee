# Render Blueprint for designbycommitt.ee (Wagtail). See README.md, "Development to release" and "Hosting".
#
# One web service and one Postgres database, both in Frankfurt. Python comes from .python-version (3.13, latest patch).
# Uploaded images and documents live on a persistent disk, which Render only allows on paid instances; with a disk,
# each deploy has a few seconds of downtime (Render stops the old instance before starting the new one).

services:
  - type: web
    name: designbycommittee
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    # The disk is only available once the service runs, so the one-time content import happens here.
    # --initial makes it a no-op as soon as the site has content.
    # hash_renditions gives older image renditions hashed (cacheable) file names; a no-op once done.
    startCommand: >-
      python manage.py import_current_site --initial --hostname designbycommitt.ee --port 443
      && python manage.py hash_renditions
      && gunicorn dbc.wsgi --bind 0.0.0.0:$PORT --access-logfile -
    healthCheckPath: /healthz/
    disk:
      name: media
      mountPath: /opt/render/project/src/storage
      sizeGB: 1
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: dbc.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: designbycommittee-db
          property: connectionString
      # The service's own *.onrender.com host is added automatically (RENDER_EXTERNAL_HOSTNAME).
      - key: ALLOWED_HOSTS
        value: designbycommitt.ee,www.designbycommitt.ee
      - key: MEDIA_ROOT
        value: /opt/render/project/src/storage/media
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DEFAULT_FROM_EMAIL
        value: Design by Committee <forms@designbycommitt.ee>
      # Entered by the site owner when the Blueprint is created (Resend → API Keys).
      - key: RESEND_API_KEY
        sync: false

databases:
  - name: designbycommittee-db
    databaseName: designbycommittee
    user: designbycommittee
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: "17"
