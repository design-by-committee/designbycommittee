{% load site_tags %}
<section class="c-section {{ background_class }}"{% if value.anchor %} id="{{ value.anchor }}"{% endif %} aria-labelledby="{{ title_id }}">
  <div class="c-wrap c-faq">
    <div>
      <h2 id="{{ title_id }}">{{ value.heading }}</h2>
      {% if value.lead %}<p class="c-lead">{{ value.lead|inline_richtext }}</p>{% endif %}
    </div>

    <div class="c-faq__list">
      {% for item in value.questions %}
        <details>
          <summary>{{ item.question }}</summary>
          <p>{{ item.answer }}</p>
        </details>
      {% endfor %}
    </div>
  </div>
</section>
