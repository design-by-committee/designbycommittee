{% load wagtailimages_tags %}
<section class="c-section {{ background_class }}"{% if value.anchor %} id="{{ value.anchor }}"{% endif %} aria-labelledby="{{ title_id }}">
  <div class="c-wrap">
    <h2 id="{{ title_id }}">{{ value.heading }}</h2>
    {% if value.lead %}<p class="c-lead">{{ value.lead }}</p>{% endif %}

    <div class="c-points">
      {% for point in value.points %}
        <div class="c-point">
          <div class="c-point__copy">
            <h3>{{ point.title }}</h3>
            {{ point.text|linebreaks }}
          </div>
          <figure class="c-point__shot">
            <div class="c-browser c-browser--card">
              <div class="c-browser__bar" aria-hidden="true">
                <span class="c-browser__dots"><i></i><i></i><i></i></span>
                {% if point.address %}<span class="c-browser__url">{{ point.address }}</span>{% endif %}
              </div>
              {% srcset_image point.image width-{480,720,1080} format-webp sizes="(min-width: 48em) min(620px, 52vw), calc(100vw - 48px)" loading="lazy" decoding="async" %}
            </div>
          </figure>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
