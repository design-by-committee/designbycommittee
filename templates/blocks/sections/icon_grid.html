{% load site_tags %}
<section class="c-section {{ background_class }}"{% if value.anchor %} id="{{ value.anchor }}"{% endif %} aria-labelledby="{{ title_id }}">
  <div class="c-wrap">
    <h2 id="{{ title_id }}">{{ value.heading }}</h2>
    {% if value.lead %}<p class="c-lead c-lead--wide">{{ value.lead }}</p>{% endif %}

    <ul class="c-icon-grid c-icon-grid--{{ value.columns|default:'3' }}">
      {% for item in value.items %}
        <li class="c-icon-item">
          <span class="c-icon">{% icon item.icon %}</span>
          <div class="c-icon-item__body">
            <h3>{{ item.title }}</h3>
            {{ item.text }}
          </div>
        </li>
      {% endfor %}
    </ul>

    {% if value.footnote %}<div class="c-prose c-icon-grid__footnote">{{ value.footnote }}</div>{% endif %}
  </div>
</section>
