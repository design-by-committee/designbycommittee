{% load wagtailimages_tags %}
{% if testimonial %}
      <figure class="c-quote-card">
        <blockquote>
          <p>“{{ testimonial.card_quote }}”</p>
        </blockquote>
        <figcaption>
          {% if testimonial.logo %}{% image testimonial.logo fill-112x112 format-webp preserve-svg alt="" width="56" height="56" loading="lazy" decoding="async" %}{% endif %}
          <span>
            <span class="c-quote-card__name">{{ testimonial.name }}</span>
            <span class="c-quote-card__role">{{ testimonial.role }}, {{ testimonial.company }}</span>
          </span>
        </figcaption>
      </figure>
    {% endif %}
