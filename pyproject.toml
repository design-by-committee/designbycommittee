[project]
name = "designbycommittee"
version = "1.0.0"
description = "designbycommitt.ee on Wagtail CMS"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=5.2,<5.3",
    "gunicorn>=27.0.1",
    "psycopg[binary]>=3.3.9",
    "wagtail>=7.4,<7.5",
    "whitenoise>=6.12.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "python-dotenv>=1.2.4",
]
