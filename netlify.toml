# The site runs on Render (see README). Netlify only hosts the DNS zone and the old static site, kept until
# 7 Dec 2026 as a rollback. An ignore command that exits 0 tells Netlify to skip every build, so it never publishes
# this repository's Python source as a static site. Delete this file once the Netlify site is deleted.
[build]
  ignore = "exit 0"
